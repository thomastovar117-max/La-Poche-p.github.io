<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contáctanos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../static/css/contactos.css">
</head>
<body class=" bg-primary" >
<nav class="navbar bg-body-primary rounded-4 text-white">
    <div class="container-fluid">
    <a class="navbar-brand text-white" href="#inicio"><img src="https://pescaderialapoche.com/wp-content/uploads/2024/04/La-Poche-Logo-Pri-300x240.png" 
        alt="La Poche Logo" width="40" height="32"> La Poche
    </a>
    </div>
</nav>
<!-- Sección de Contacto -->
<section id="contacto" class="py-5 bg-info text-dark rounded-4">
    <div class="container">
    <h2 class="text-center mb-4">
        <img src="https://pescaderialapoche.com/wp-content/uploads/2024/04/La-Poche-Logo-Pri-300x240.png" 
        alt="La Poche Logo" width="40" height="32"> Contáctanos
    </h2>
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-4">
                    <form action="" method="post">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                                <input type="text" id="nombre" class="form-control" placeholder="Tu nombre completo" required>
                            </div>
                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo</label>
                            <input type="email" id="correo" class="form-control" placeholder="ejemplo@correo.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="mensaje" class="form-label">Mensaje</label>
                            <textarea id="mensaje" class="form-control" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
                        </div>
                </div>
                <div class="text-center">
                <button type="submit" class="btn btn-primary px-5">
                    <i class="bi bi-send-fill"></i> Enviar
                </button>
                </div>
            </div>
        </div>
    </div>
    </div>
</div>
</section>
<!-- Seccion de footer redes sociales -->
<section>
<footer id="social-icons" class="text-center bg-dark text-white py-4 rounded-4" >
    <h3>
    <img src="https://pescaderialapoche.com/wp-content/uploads/2024/04/La-Poche-Logo-Pri-300x240.png" 
    alt="Logo La Poche" width="100" height="40">
    </h3>
    <p class="mb-2">&copy;2026 Creditos a las paginas oficiales de La pescaderia la Poche</p>
</footer>
</section>
    <!-- Scripts de Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
