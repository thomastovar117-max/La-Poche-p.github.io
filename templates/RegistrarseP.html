<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../static/css/register-style.css">
</head>
<body class="bg-primary">
  <nav class="navbar bg-body-primary rounded-4 text-white">
    <div class="container-fluid">
    <a class="navbar-brand text-white" href="https://thomastovar117-max.github.io/La-Poche-p.github.io/"><img src="https://pescaderialapoche.com/wp-content/uploads/2024/04/La-Poche-Logo-Pri-300x240.png" 
          alt="La Poche Logo" width="40" height="32"> La Poche
    </a>
    </div>
</nav>
<section id="registro" class="py-5 bg-info text-dark rounded-4">
    <div class="container">
        <h2 class="text-center mb-4">
        <img src="https://pescaderialapoche.com/wp-content/uploads/2024/04/La-Poche-Logo-Pri-300x240.png" 
            alt="La Poche Logo" width="40" height="32"> Crear Cuenta
        </h2>
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card shadow-lg border-0 rounded-4 p-4">
            <form action="">
                <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Nombres</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                        <input type="text" class="form-control" placeholder="Nombres" required>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Apellidos</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person-vcard-fill"></i></span>
                    <input type="text" class="form-control" placeholder="Apellidos" required>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">Correo Electrónico</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                    <input type="email" class="form-control" placeholder="correo@gmail.com" required>
                  </div>
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">Teléfono</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-telephone-fill"></i></span>
                    <input type="tel" class="form-control" placeholder="+57 3219876540" required>
                  </div>
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">Usuario</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person-circle"></i></span>
                    <input type="text" class="form-control" placeholder="Nombre de Usuario" required>
                  </div>
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">Rol</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-shield-lock-fill"></i></span>
                    <select class="form-select" required>
                      <option value="">Seleccione un rol</option>
                      <option value="admin">Administrador</option>
                      <option value="usuario">Empleado</option>
                      <option value="invitado">Invitado</option>
                    </select>
                  </div>
                </div>
                <div class="col-md-6 mb-3 position-relative">
                  <label class="form-label">Contraseña</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="**************" required>
                  </div>
                  <i class="bi bi-eye toggle" id="togglePassword"></i>
                </div>
                <div class="col-md-6 mb-3 position-relative">
                  <label class="form-label">Confirmar Contraseña</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="**************" required>
                  </div>
                  <i class="bi bi-eye toggle" id="toggleConfirm"></i>
                </div>
              </div>
              <div class="form-check my-3">
                <input type="checkbox" id="terms" class="form-check-input" required>
                <label for="terms" class="form-check-label">Acepto los términos y condiciones</label>
              </div>
              <button class="btn btn-primary w-100 btn-register"><i class="bi bi-person-check-fill"></i> Crear Cuenta</button>
              <div class="text-center mt-4">
                <span class="text-dark">¿Ya tiene una cuenta?</span>
                <a href="./InicioP.html">Iniciar Sesión</a>
              </div>
            </form>
          </div>
        </div>
        </div>
    </div>
</section>
<section>
<footer id="social-icons" class="text-center bg-dark text-white py-4 rounded-4" >
  <h3>
    <img src="https://pescaderialapoche.com/wp-content/uploads/2024/04/La-Poche-Logo-Pri-300x240.png" 
    alt="Logo La Poche" width="100" height="40">
  </h3>
  <p class="mb-2">&copy;2026 Creditos a las paginas oficiales de La pescaderia la Poche</p>
</footer>
</section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/form-register.js"></script>
</body>
</html>
