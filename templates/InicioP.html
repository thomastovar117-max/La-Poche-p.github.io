<!DOCTYPE html>
<html lang="es">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicio de Sesión - La Poche</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="../static/css/inciop.css">
</head>
<body class="bg-primary">
    <nav class="navbar bg-body-primary rounded-4 text-white">
    <div class="container-fluid">
    <a class="navbar-brand text-white" href="#inicio"><img src="https://pescaderialapoche.com/wp-content/uploads/2024/04/La-Poche-Logo-Pri-300x240.png" 
        alt="La Poche Logo" width="40" height="32"> La Poche
    </a>
    </div>
</nav>
<section id="login" class="py-5 bg-info text-dark rounded-4">
    <div class="container">
    <h2 class="text-center mb-4">
        <img src="https://pescaderialapoche.com/wp-content/uploads/2024/04/La-Poche-Logo-Pri-300x240.png" 
            alt="La Poche Logo" width="40" height="32"> Bienvenido
    </h2>
    <div class="row justify-content-center">
        <div class="col-md-6">
        <div class="card shadow-lg border-0 rounded-4 p-4">
            <form action="">
            <div class="mb-3">
                <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                <input type="email" id="Email" class="form-control" placeholder="Correo Electrónico" required>
                </div>
            </div>
            <div class="mb-3 position-relative">
                <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" id="password" class="form-control" placeholder="Contraseña" required>
                </div>
                <i class="bi bi-eye toggle" id="togglePassword"></i>
            </div>
            <div class="form-check mb-3">
                <input type="checkbox" id="remember" class="form-check-input">
                <label for="remember" class="form-check-label">Recordarme</label>
            </div>
            <button class="btn btn-primary w-100 btn-login"><i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión</button>
            <div class="d-flex justify-content-between mt-3">
                <a href="#">¿Olvidaste tu contraseña?</a>
                <a href="./RegistrarseP.html">Crear Cuenta</a>
            </div>
            </form>
            </div>
        </div>
    </div>
</div>
</section>
<section>
<footer id="social-icons" class="text-center bg-dark text-white py-4 rounded-4" >
    <h3>
    <img src="https://pescaderialapoche.com/wp-content/uploads/2024/04/La-Poche-Logo-Pri-300x240.png" 
    alt="Logo La Poche" width="100" height="40">
    </h3>
    <p class="mb-2">&copy;2026 Creditos a las paginas oficiales de La pescaderia la Poche</p>
</footer>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../static/js/form.js"></script>
</body>
</html>
